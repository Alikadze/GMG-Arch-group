<p-toast [life]="2000"></p-toast>

<form [formGroup]="form" class="relative min-h-[100vh] flex justify-center items-center overflow-hidden bg-ink px-4" (ngSubmit)="login()">
  <!-- Background texture -->
  <div class="absolute inset-0 bg-grid-lines [background-size:46px_46px] opacity-50"></div>

  <div @slideIn class="relative z-10 bg-white rounded-sm shadow-card w-full max-w-md overflow-hidden">
    <div class="hazard-bar w-full"></div>

    <div class="p-8 md:p-10">
      <div class="text-center mb-8">
        <span class="eyebrow justify-center">{{ 'Admin' | translate }}</span>
        <h1 class="section-title text-ink text-2xl mt-3">{{ 'Login for page administrator' | translate }}</h1>
      </div>

      <div class="mb-5">
        <label for="email" class="block text-sm font-medium text-ink-500 uppercase tracking-wide mb-1.5">{{ 'Email' | translate }}</label>
        <input
          pInputText
          type="email"
          id="email"
          formControlName="email"
          class="w-full !rounded-sm"
        />
      </div>

      <div class="mb-8">
        <label for="password" class="block text-sm font-medium text-ink-500 uppercase tracking-wide mb-1.5">{{ 'Password' | translate }}</label>
        <input
          pInputText
          type="password"
          id="password"
          formControlName="password"
          class="w-full !rounded-sm"
        />
      </div>

      <p-button
        label="{{ 'Submit' | translate }}"
        [loading]="loading"
        type="submit"
        styleClass="w-full justify-center !bg-accent-500 !border-accent-500 !rounded-sm !font-display !uppercase !tracking-wider py-3 transition-colors duration-300 hover:!bg-accent-600 hover:!border-accent-600"
      ></p-button>
    </div>
  </div>
</form>
