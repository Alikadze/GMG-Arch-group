<!-- ============================ HERO ============================ -->
<section class="hero relative min-h-[92vh] flex items-center overflow-hidden bg-ink">
  <!-- Background image + overlays -->
  <div class="absolute inset-0">
    <img
      src="assets/images/adf1101a-0f8c-404f-9df3-5837bf387dfd-1_Exterior_House_Beautiful_Whole_Home_Concept_House_Castle_Homes_Photo_Reed_Brown_Photography.webp"
      alt="GMG Arch group project"
      class="w-full h-full object-cover opacity-45"
    >
    <div class="absolute inset-0 bg-gradient-to-r from-ink via-ink/85 to-ink/20"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-ink via-transparent to-transparent"></div>
  </div>

  <!-- Blueprint grid texture -->
  <div class="absolute inset-0 bg-grid-lines [background-size:46px_46px] opacity-70"></div>

  <div class="relative z-10 w-full max-w-7xl mx-auto px-6 md:px-10 py-28">
    <span class="eyebrow reveal">{{ 'Construction & Architecture' | translate }}</span>

    <h1 id="company-name" class="mt-6 font-display font-bold uppercase text-white leading-[0.92] text-5xl sm:text-7xl md:text-8xl">
      <span class="reveal block">GMG Arch</span>
      <span class="reveal block text-accent-500">group</span>
    </h1>

    <p class="reveal mt-7 max-w-xl text-lg md:text-xl text-concrete-300 leading-relaxed">
      {{ 'Building the Future with Vision and Expertise' | translate }}
    </p>

    <div class="reveal mt-10 flex flex-wrap gap-4">
      <button (click)="goToProjects()" class="btn-accent">
        {{ 'View Projects' | translate }}
        <i class="pi pi-arrow-right text-sm"></i>
      </button>
      <button (click)="goToContact()"
        class="inline-flex items-center gap-2 px-8 py-[0.9rem] font-display uppercase tracking-wider text-white border border-white/40 rounded-sm transition-all duration-300 hover:bg-white hover:text-ink">
        {{ 'Contact Us' | translate }}
      </button>
    </div>
  </div>

  <!-- Bottom hazard accent -->
  <div class="hazard-bar absolute bottom-0 left-0 w-full"></div>
</section>

  <div class="mb-6">
    <span class="eyebrow">{{ 'Featured' | translate }}</span>
  </div>
  <app-carousel/>
</section>
