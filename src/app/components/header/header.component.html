<p-toast life="1500"/>

<header class="w-full mainContainer bg-white/90 backdrop-blur-md border-b border-concrete-300 shadow-sm transition-all duration-300">
  <div class="hazard-bar"></div>

  <div class="flex gap-8 items-center justify-between px-6 md:px-10 h-[80px]">
    <div (click)="navigateToHome()" class="cursor-pointer flex items-center gap-3 shrink-0">
      <img
        class="size-24 object-contain"
        src="assets/images/452377664_988691489496925_3438030518400011853_n-removebg-preview.png"
        alt="GMG Arch group logo"
      >
    </div>

    <nav class="hidden md:flex">
      <ul class="flex gap-x-1">
        <li
          (click)="navigateToHome()"
          class="nav-link"
          [class.active]="isActive('/')"
        >
          <a class="font-display uppercase tracking-wide text-[15px]">{{'Home'| translate}}</a>
        </li>
        <li
          (click)="navigateToProject()"
          id="authed"
          class="nav-link"
          [class.active]="isActive('/project/all')"
        >
          <a class="font-display uppercase tracking-wide text-[15px]">{{'Projects'| translate}}</a>
        </li>
        <li
          (click)="navigateToAbout()"
          class="nav-link"
          [class.active]="isActive('/about')"
        >
          <a class="font-display uppercase tracking-wide text-[15px]">{{'About'| translate}}</a>
        </li>
        <li
          (click)="navigateToContact()"
          class="nav-link"
          [class.active]="isActive('/contact')"
        >
          <a class="font-display uppercase tracking-wide text-[15px]">{{'Contact'| translate}}</a>
        </li>
      </ul>
    </nav>


    <div class="flex gap-4 items-center">

      <div class="hidden md:block">
        @if(isAuthenticated | async) {
          <p-button
          id="authed"
          label="{{'Logout'| translate}}"
          type="button"
          styleClass="header-btn header-btn--danger"
          (onClick)="logout($event)"
        />
        } @else {
          <p-button
            id="!authed"
            label="{{'Admin'| translate}}"
            type="button"
            styleClass="header-btn header-btn--ghost"
            (onClick)="navigateToAuth()"
          />
        }

      </div>

      <app-select-language></app-select-language>
    </div>

    <div class="card flex md:hidden justify-content-center">
      <p-button (onClick)="menu.toggle($event)" styleClass="!bg-ink !border-ink hover:!bg-ink-700">
        <i class="pi pi-bars"></i>
      </p-button>
      <p-tieredMenu #menu [model]="items" [popup]="true" />
    </div>
  </div>
</header>

<p-confirmPopup #confirmPopup>
  <ng-template pTemplate="headless" let-message let-test>
      <div class="border-round p-3">
          <span>{{ message.message }}</span>
          <div class="flex align-items-center gap-2 mt-3">
              <p-button id="confirm" (onClick)="accept()" label="{{'Confirm' | translate}}" size="small" />
              <p-button id="cancel" (onClick)="reject()" label="{{'Cancel' | translate}}" [outlined]="true" size="small" />
          </div>
      </div>
  </ng-template>
</p-confirmPopup>
