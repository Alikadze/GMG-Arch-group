<section class="w-full bg-concrete-100 border-y border-concrete-300 mt-0">
  <div class="max-w-7xl mx-auto px-6 md:px-10 py-16 md:py-20" #cardsContainer>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">

      <div class="firstCard card group relative bg-white rounded-sm p-8 md:p-10 shadow-card border-l-4 border-accent-500 flex items-center gap-8 transition-shadow duration-300 hover:shadow-card-hover">
        <div class="font-display font-bold text-accent-500 text-6xl md:text-7xl leading-none tabular-nums">
          34
        </div>
        <div class="font-display uppercase tracking-wide text-ink text-xl md:text-2xl leading-snug">
          {{'Buildings' | translate}} <br>
          {{'Finished Now' | translate}}
        </div>
        <i class="pi pi-building absolute right-6 top-6 text-concrete-300 text-3xl group-hover:text-accent-500 transition-colors duration-300"></i>
      </div>

      <div class="secondCard card group relative bg-white rounded-sm p-8 md:p-10 shadow-card border-l-4 border-accent-500 flex items-center gap-8 transition-shadow duration-300 hover:shadow-card-hover">
        <div class="font-display font-bold text-accent-500 text-6xl md:text-7xl leading-none tabular-nums">
          12
        </div>
        <div class="font-display uppercase tracking-wide text-ink text-xl md:text-2xl leading-snug">
          {{'Years' | translate}} <br>
          {{'Experience' | translate}}
        </div>
        <i class="pi pi-verified absolute right-6 top-6 text-concrete-300 text-3xl group-hover:text-accent-500 transition-colors duration-300"></i>
      </div>

    </div>
  </div>
</section>
