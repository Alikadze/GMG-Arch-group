<div class="flex flex-col gap-1">
  <!-- Project context -->
  <div class="flex items-start gap-3 bg-concrete-100 border-l-4 border-accent-500 rounded-sm px-4 py-3 mb-2">
    <i class="pi pi-building text-accent-500 text-xl mt-0.5"></i>
    <div>
      <div class="text-ink-500 text-xs uppercase tracking-wider">{{ 'Interested in this project' | translate }}</div>
      <div class="font-display uppercase tracking-wide text-lg text-ink leading-tight break-words">{{ projectName }}</div>
    </div>
  </div>

  <form [formGroup]="form" class="flex flex-col gap-5 mt-2" (ngSubmit)="submit()">
    <div>
      <label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">{{ 'Full name' | translate }}</label>
      <input pInputText formControlName="name" class="w-full !rounded-sm" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">{{ 'Email Address' | translate }}</label>
      <input pInputText formControlName="from" class="w-full !rounded-sm" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">{{ 'Phone Number' | translate }}</label>
      <p-inputMask mask="999-99-99-99" formControlName="number" styleClass="w-full !rounded-sm" class="w-full" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">{{ 'Message' | translate }}</label>
      <textarea
        pInputTextarea
        formControlName="message"
        rows="4"
        class="w-full !rounded-sm resize-none"
        placeholder="{{ 'Tell us what you would like to know about this project' | translate }}"
      ></textarea>
    </div>

    <p-button
      type="submit"
      label="{{ 'Send Inquiry' | translate }}"
      icon="pi pi-send"
      [loading]="loading"
      styleClass="w-full justify-center !bg-accent-500 !border-accent-500 !rounded-sm !font-display !uppercase !tracking-wider py-3 hover:!bg-accent-600 hover:!border-accent-600"
    />
  </form>
</div>
